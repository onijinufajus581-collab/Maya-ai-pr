
name: MAYA AI APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAYA AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -o "$ZIP" -d extracted
          else
            echo "No ZIP found. Using repository files."
            mkdir -p extracted
            cp -r ./* extracted/ 2>/dev/null || true
            cp -r ./.github extracted/ 2>/dev/null || true
          fi

          if [ -d "extracted/MAYA_AI_Android" ]; then
            cp -r extracted/MAYA_AI_Android/. .
          else
            cp -r extracted/. .
          fi

          echo "Project files:"
          ls -la

      - name: Verify Project
        run: |
          test -d app || (echo "ERROR: app folder missing" && exit 1)
          test -f app/build.gradle || exit 1
          test -f settings.gradle || exit 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
